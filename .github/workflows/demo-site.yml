name: demo-site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build demo
        run: npm run build
        env:
          VITE_LUME_ENV: demo

      - name: Restrict the demo to the office range
        run: node scripts/restrict-demo.mjs dist/staticwebapp.config.json
        env:
          DEMO_ALLOWED_IPS: ${{ secrets.DEMO_ALLOWED_IPS }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LUMEDEMO }}
          action: upload
          app_location: dist
          skip_app_build: true
          production_branch: main
